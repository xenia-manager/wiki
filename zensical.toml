[project]
site_url = "https://xenia-manager.github.io/wiki/"
site_name = "Xenia Manager Wiki"
site_description = "Wiki for Xenia Manager"

copyright = "Copyright &copy; 2026 Xenia Manager"

repo_url = "https://github.com/xenia-manager/xenia-manager"
repo_name = "xenia-manager/xenia-manager"
edit_uri = "edit/main/docs/"

nav = [
  { Home = "index.md" },
  { "Getting Started" = [
    { Installation = "getting-started/installation.md" },
    { Quickstart = "getting-started/quickstart.md" },
  ] },
  { Guides = [
    { Emulator = [
      { Library = "guides/library.md" },
      { "Manage Xenia" = "guides/manage-xenia.md" },
      { "Xenia Settings" = "guides/xenia-settings.md" },
      { Mousehook = "guides/mousehook.md" },
    ] },
    { "Game Data" = [
      { Content = "guides/content.md" },
      { Patches = "guides/patches.md" },
      { "Profiles & Saves" = "guides/profiles-saves.md" },
    ] },
    { "App Integration" = [
      { "Steam Shortcuts" = "guides/steam-shortcuts.md" },
      { "BigScreen Mode" = "guides/bigscreen.md" },
      { "Manager Settings" = "guides/manager-settings.md" },
    ] },
  ] },
  { BigScreen = [
    { Overview = "big-screen/overview.md" },
    { "Design Philosophy" = "big-screen/design-philosophy.md" },
    { Core = [
      { "Boot Sequence" = "big-screen/boot-sequence.md" },
      { "Input and Navigation" = "big-screen/input-and-navigation.md" },
      { "Modal Stack" = "big-screen/modal-stack.md" },
      { "Services and State" = "big-screen/services-and-state.md" },
    ] },
    { Screens = [
      { Dashboard = "big-screen/dashboard-deep-dive.md" },
      { "Game Details" = "big-screen/game-details.md" },
      { Library = "big-screen/library-deep-dive.md" },
      { Profiles = "big-screen/profiles-deep-dive.md" },
      { Gallery = "big-screen/gallery-deep-dive.md" },
    ] },
    { Glossary = "big-screen/glossary.md" },
  ] },
  { Help = [
    { Troubleshooting = "help/troubleshooting.md" },
    { FAQ = "help/faq.md" },
    { Development = "help/development.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

[project.theme.icon]
logo = "lucide/gamepad-2"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "Cascadia Mono"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
